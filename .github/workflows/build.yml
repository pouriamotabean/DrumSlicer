name: Build VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64          # default generator = the Visual Studio installed on the runner (2026 now)

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force "build/DrumSlicer_artefacts/Release/VST3/Drum Slicer.vst3" "dist/"
          Copy-Item -Force "build/Release/peel_cli.exe" "dist/" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse dist | Select-Object -First 20 FullName

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DrumSlicer-VST3-Windows
          path: dist/
